name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # --base lands on the trailing `vite build`; local builds stay at /.
      # To pin the dataset for a critical pitch, add VITE_DEMO_ANCHOR=YYYY-MM-DD
      # to this step's env (or use ?asof= on the live URL — no rebuild needed).
      - run: npm run build -- --base=/timegram-agent-ops/
      # SPA fallback: GitHub Pages serves 404.html for unknown paths, which
      # boots the app and lets the router resolve deep links.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
